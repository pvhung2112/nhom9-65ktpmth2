<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Quản lý Tài liệu Học tập - Cashew Cloud">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="study_document_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cashew Study - Quản lý Tài liệu Học tập Cloud</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase Web SDK for Google Sign-In via Popup (accounts.google.com) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBLEAEsYQ9LiMKQFtYoUJfvn7fXnf19zXE",
      authDomain: "study-document-cloud.firebaseapp.com",
      projectId: "study-document-cloud",
      storageBucket: "study-document-cloud.appspot.com",
    };
    if (typeof firebase !== 'undefined') {
      try {
        firebase.initializeApp(firebaseConfig);
      } catch (e) {
        console.warn("Firebase init error:", e);
      }
    }

    window.triggerGoogleSignIn = function() {
      return new Promise((resolve) => {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          firebase.auth().signInWithPopup(provider)
            .then((result) => {
              const u = result.user;
              resolve(JSON.stringify({
                success: true,
                uid: u.uid,
                email: u.email,
                displayName: u.displayName || u.email.split('@')[0],
                photoURL: u.photoURL || '',
              }));
            })
            .catch((err) => {
              console.warn("Firebase popup error/closed:", err);
              window.open('https://accounts.google.com/o/oauth2/auth?response_type=code&client_id=344574429469-nmbnnl4piuqo6seljr1t2u6v248n6nbo.apps.googleusercontent.com&redirect_uri=https://study-document-cloud.firebaseapp.com/__/auth/handler&scope=openid+email+profile', '_blank');
              resolve(JSON.stringify({
                success: false,
                code: err.code,
                message: err.message
              }));
            });
        } catch (e) {
          window.open('https://accounts.google.com/o/oauth2/auth?response_type=code&client_id=344574429469-nmbnnl4piuqo6seljr1t2u6v248n6nbo.apps.googleusercontent.com&redirect_uri=https://study-document-cloud.firebaseapp.com/__/auth/handler&scope=openid+email+profile', '_blank');
          resolve(JSON.stringify({ success: false, message: e.toString() }));
        }
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
